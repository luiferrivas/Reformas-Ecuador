# ==============================================================================
# CONFIGURACIÓN TÉCNICA Y PARÁMETROS: REFORMA TARIFARIA Y SUBSIDIOS ELÉCTRICOS
# ==============================================================================
# Base Legal: Proyecto de Ley Reformatoria a la LOSPEE
# Documentos vinculados:
#   - proyectos_ley/subsidios_electricos/Proyecto_Ley_Subsidios_Electricos_Ecuador.md
#   - proyectos_ley/subsidios_electricos/Memoria_Tecnica_Economica.md
# ==============================================================================

reforma_id: "reforma_subsidios_electricos"
denominacion: "Ley Orgánica Reformatoria a la Ley Orgánica del Servicio Público de Energía Eléctrica (LOSPEE)"
version: "1.0.0"

# ------------------------------------------------------------------------------
# 1. UMBRALES DE CONSUMO PROTEGIDO (TARIFA PREFERENTE)
# ------------------------------------------------------------------------------
umbrales_consumo:
  residencial:
    sierra:
      limite_preferente_kwh_mes: 250
      criterio: "Cubre iluminación, refrigeración eficiente y computación del 78% de hogares"
      consumo_promedio_estimado_kwh_mes: 140
    costa_amazonia:
      limite_preferente_base_kwh_mes: 250
      limite_preferente_temporada_calida_kwh_mes: 300
      limite_maximo_excepcion_bioclimatica_kwh_mes: 320
      criterio: "Ajuste estacional para refrigeración y ventilación/climatización moderada"
      consumo_promedio_estimado_kwh_mes: 205
    regla_cobro_excedente: "marginal_por_tramos" # (T_preferente * min(C, U)) + (T_real * max(0, C - U))

  soberania_alimentaria:
    nivel_1_comercio_minorista:
      descripcion: "Tiendas de abarrotes, micromercados de barrio, fruterías y legumbres"
      limite_preferente_kwh_mes: 500
      cobertura_necesidad_operativa_pct: 120 # Cubre 110% - 150% de refrigeración continua y exhibición
      equipos_tipicos:
        - "1-2 vitrinas refrigeradas lácteos/bebidas (0.25 kW)"
        - "1 congelador horizontal helados/carnes (0.20 kW)"
        - "Iluminación LED y terminal punto de venta (0.15 kW)"
    nivel_2_procesamiento_artesanal:
      descripcion: "Panaderías artesanales con obrador electromecánico, carnicerías con cuarto frío y centros lecheros rurales"
      limite_preferente_kwh_mes: 800
      cobertura_necesidad_operativa_pct: 85 # Cubre 80% - 90% de amasadoras, batidoras y frío continuo
      equipos_tipicos:
        - "Amasadora espiral industrial (3.0 kW - 4 HP)"
        - "Batidora planetaria de masas (1.5 kW - 2 HP)"
        - "Cámara de fermentación controlada / cuarto frío (1.2 kW)"
        - "Vitrinas de conservación (0.35 kW)"
      objetivo_politica_publica: "Evitar inflación en el precio del pan popular de batalla y alimentos esenciales"
    nivel_3_agroindustria_consumo_nacional:
      descripcion: "Molinos de trigo/harina, piladoras de arroz, balanceado avícola/porcino, lácteos de canasta básica"
      demanda_estimada_gwh_mes: 85.0
      demanda_estimada_gwh_ano: 1020.0
      tarifa_base_eficiente_usd_kwh: 0.075
      destino_exclusivo: "Canasta Básica Familiar en mercado nacional"
      filtro_forense_exportacion: "Cruce mensual SRI-SENAE; cuota DAE tributa a costo real pleno"
      exclusion_expresa: ["Bebidas alcoholicas", "Cerveceras", "Bebidas azucaradas", "Snacks", "Tabaco"]
      modulacion_horaria: "Operacion de molienda pesada en horas valle y llanas (23:00 a 17:00); pico 18:00-22:00 a tarifa termica marginal"

  agua_potable_y_saneamiento_municipal:
    descripcion: "Estaciones de captación, potabilización y bombeo de agua potable y plantas de tratamiento de aguas residuales operadas por GADs municipales"
    demanda_estimada_gwh_mes: 38.0
    demanda_estimada_gwh_ano: 456.0
    tarifa_base_eficiente_usd_kwh: 0.078
    condicion_inviolable_pago: "Cero tolerancia a la mora; débito automático centralizado en MEF/BCE sobre alícuotas del Modelo de Equidad Territorial a los 60 días"
    modulacion_operativa: "Bombeo nocturno preferente a tanques y reservorios en horas valle (23:00 a 06:00)"

  juntas_riego_campesino_comunitario:
    descripcion: "Sistemas comunales de bombeo de agua para riego agrícola operados por juntas comunitarias registradas en MAATE"
    demanda_estimada_gwh_mes: 16.0
    demanda_estimada_gwh_ano: 192.0
    tarifa_base_eficiente_usd_kwh: 0.075
    destino_productivo: "Cultivos de hortalizas, tubérculos, legumbres y cereales de agricultura familiar para consumo interno"
    exclusion_expresa: ["Haciendas agroexportadoras de banano", "Camaroneras", "Florícolas", "Plantaciones de cacao"]

  industria_farmaceutica_nacional_genericos:
    descripcion: "Plantas de fabricación y envasado de medicamentos genéricos y sueros parenterales del Cuadro Nacional de Medicamentos Básicos (CNMB)"
    demanda_estimada_gwh_mes: 11.0
    demanda_estimada_gwh_ano: 132.0
    tarifa_base_eficiente_usd_kwh: 0.078
    exclusion_expresa: ["Cosméticos", "Suplementos dietéticos suntuarios", "Fármacos no esenciales"]

  adultos_mayores_3ra_edad:
    descripcion: "Focalización equitativa y capping del subsidio para adultos mayores (LOPAM Art. 14)"
    descuento_tarifa_pct: 50.0
    limite_descuento_vital_kwh_mes: 50
    costo_mensual_estimado_vital_usd: 2.35
    tramo_residencial_ordinario_max_kwh_mes: 250
    regla_exceso_250kwh: "costo_real_pleno_100pct"
    limite_suministros_por_cedula: 1
    depuracion_automatica_registro_civil: true
    ahorro_fiscal_estimado_anual_usd: 45000000

  subsidios_cruzados:
    prohibicion_expresa: true
    modelo_regulatorio: "cost_of_service"
    principio: "Cada segmento tarifario cubre sus propios costos eficientes sin sobretasas intersectoriales"
    autofinanciamiento_residencial_hidro: true

  mecanismos_quirurgicos_control_regresivo:
    segundas_residencias:
      descripcion: "Exclusión de casas de playa, veraneo y predios no habitados del bloque preferente"
      tarifa_aplicada: "costo_real_pleno_desde_kwh_0"
      ahorro_fiscal_anual_usd: 35000000
    auditoria_macro_fraude:
      sectores_auditados: ["Piladoras de arroz", "Haciendas bananeras tecnificadas", "Granjas clandestinas de criptomineria"]
      metodologia: ["Balance algoritmico en transformadores", "Termografia satelital e infrarroja", "Analitica de factor de carga plano"]
      sancion_retroactiva_anos: 5
      recargo_sancionatorio_pct: 100.0
      recuperacion_anual_usd: 185000000
    urbanizaciones_lujo:
      financiamiento_infraestructura_pct: 100.0 # Promotores privados pagan 100% de la red
      ahorro_distribuidoras_anual_usd: 25000000
    nota_simplificacion_arquitectura:
      gran_mineria: "Gravada al 100% en sectores_no_protegidos sin pliego especial"
      recarga_vehiculos_electricos: "Absorbida directamente en el tramo >250 kWh a costo real pleno sin submedidor"

  industrias_expresamente_descartadas_tarifa_preferente:
    cemento:
      empresas_referencia: ["Holcim Ecuador", "UNACEM", "Cementos Chimborazo"]
      justificacion_descarte: "Estructura oligopólica altamente rentable con hornos de clinker; costo de energía trasladable al mercado; se concede exclusivamente la transición escalonada de 12 meses."
    siderurgia_y_metalmecanica:
      empresas_referencia: ["Adelca", "Novacero", "Andec"]
      justificacion_descarte: "Hornos de arco eléctrico intensivos en potencia; deben migrar a contratos bilaterales privados, eficiencia de chatarra y techos solares."
    textil_y_plasticos:
      justificacion_descarte: "Manufacturas no alimentarias; no califican a tarifa preferente permanente para evitar distorsiones de competencia; amparadas por crédito verde CFN."
    gran_mineria:
      empresas_referencia: ["Mirador (Ecuacorriente)", "Fruta del Norte (Lundin Gold)"]
      justificacion_descarte: "Operaciones dolarizadas con altos márgenes en mercados mundiales de metales (cobre/oro); pagan 100% costo real pleno."
    agroexportacion:
      sectores_referencia: ["Camaroneras intensivas", "Haciendas bananeras de exportación", "Florícolas", "Cacao fino de aroma"]
      justificacion_descarte: "Ventas 100% en divisas; la energía de la red ya les representa ahorro masivo frente al diésel internacional; pagan tarifa real plena."

  sectores_no_protegidos:
    descripcion: "Comercio de gran escala, agroexportación intensiva (camarón, banano, flores, cacao), gran minería metálica e hidrocarburos, manufacturas generales, banca y sector público"
    subsidio_estatal_pct: 0.0
    tratamiento_tarifario: "costo_real_pleno_100pct"

# ------------------------------------------------------------------------------
# 2. ORDEN DE MÉRITO Y COSTOS DE GENERACIÓN SEGÚN REGIÓN
# ------------------------------------------------------------------------------
orden_de_merito:
  continente:
    fuente_preferente_prioritaria: "hidroelectrica_amortizada"
    estratos_costo_usd_kwh:
      hidroelectrica_amortizada:
        min: 0.015
        max: 0.035
        centrales: ["Paute-Molino", "Mazar", "Sopladora", "Coca Codo Sinclair", "Delsitanisagua"]
      renovables_no_convencionales:
        min: 0.045
        max: 0.065
        tecnologias: ["Solar Fotovoltaica", "Eólica Continental", "Biomasa"]
      termica_gas_natural_local:
        min: 0.070
        max: 0.090
        centrales: ["Termogas Machala (Campo Amistad)"]
      termica_bunker_fuel_oil:
        min: 0.110
        max: 0.150
        centrales: ["Trinitaria", "Esmeraldas II"]
      termica_diesel_e_importaciones:
        min: 0.180
        max: 0.350
        origen: ["Barcazas y generadores móviles diésel", "Interconexión Colombia / Perú en sequía"]

  galapagos_insular:
    fuente_preferente_prioritaria: "eolica_y_solar_insular_con_bess"
    estratos_costo_usd_kwh:
      renovables_insulares_con_baterias:
        min: 0.080
        max: 0.140
        parques: ["Parque Eólico San Cristóbal", "Eólica Baltra", "Solar Santa Cruz", "Solar Isabela"]
      termica_diesel_insular:
        min: 0.350
        max: 0.500
        nota: "Alto costo logístico de transporte en barcazas de doble casco y riesgo ecológico marítimo"

