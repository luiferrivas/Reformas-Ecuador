# ------------------------------------------------------------------------------
# 4. MODELO TARIFARIO Y REGLAS DE CÁLCULO
# ------------------------------------------------------------------------------
modelo_tarifario:
  piso_tarifario_minimo_legal:
    activo: true
    descripcion: "La tarifa preferente resultante no podrá ser inferior al pliego tarifario regulado actual"
    formula: "T_preferente = max(T_actual_regulada, C_gen_barato + C_trans + C_dist + C_com + C_SAPG)"
    objetivo: "Prevenir descalces financieros en las 20 empresas eléctricas distribuidoras (CNEL, EEQ, etc.)"
    tarifa_residencial_piso_usd_kwh: 0.092

  tarifa_costo_real_pleno:
    promedio_referencial_usd_kwh: 0.180
    rango_mercado_usd_kwh:
      min: 0.160
      max: 0.220
    componentes_reconocidos:
      - id: "C_gen_real"
        nombre: "Costo ponderado de generación eficiente real"
      - id: "C_trans"
        nombre: "Peaje de transmisión del Sistema Nacional de Transmisión"
      - id: "C_dist"
        nombre: "Valor Agregado de Distribución (VAD) eficiente"
      - id: "C_com"
        nombre: "Costos comerciales de medición, lectura y recaudación"
      - id: "C_perdidas"
        nombre: "Reconocimiento exclusivo de pérdidas técnicas eficientes"
        tope_maximo_perdidas_tecnicas_pct: 8.5
      - id: "C_SAPG"
        nombre: "Servicio de Alumbrado Público General proporcional"

  factor_contingencia_climatica_fcc:
    descripcion: "Cargo temporal durante estiajes severos por generación térmica de emergencia"
    bonificacion_ahorro:
      umbral_reduccion_consumo_pct: 10.0
      exoneracion_fcc_pct: 100.0
      mecanismo: "Si el abonado ahorra >= 10% vs su promedio histórico, no paga FCC"

# ------------------------------------------------------------------------------
# 5. BLOQUES HORARIOS TIME-OF-USE (TOU)
# ------------------------------------------------------------------------------
tarifas_horarias_tou:
  activas: true
  bloques:
    valle_y_supervalle:
      franjas:
        - "23:00 - 06:00"
        - "10:00 - 14:00 (Ventana de radiación solar máxima)"
      costo_marginal_estimado_usd_kwh: 0.035
      objetivo: "Aprovechar excedentes de agua nocturna y solar diurna; recarga de BESS y vehículos eléctricos"
    llano:
      franjas:
        - "06:00 - 10:00"
        - "14:00 - 18:00"
        - "22:00 - 23:00"
      costo_marginal_estimado_usd_kwh: 0.090
      objetivo: "Consumo productivo ordinario"
    pico:
      franjas:
        - "18:00 - 22:00"
      costo_marginal_estimado_usd_kwh: 0.260
      objetivo: "Desplazar demanda fuera del horario crítico; incentivo a descarga de baterías BESS"
    movilidad_electrica_vehiculos_electricos:
      principio_rector: "Recarga de bajo costo condicionada exclusivamente a la disponibilidad de superávit en red"
      ventanas_superavit_permitidas_tarifa_valle:
        - "23:00 - 06:00 (Superávit hidroeléctrico de pasada / eólico nocturno)"
        - "10:00 - 14:00 (Superávit de generación solar fotovoltaica)"
      tarifa_valle_recarga_usd_kwh: 0.065
      recarga_fuera_de_valle:
        tratamiento: "Tarifa plana ordinaria o costo real pleno TOU con Factor de Contingencia Climática (FCC)"
        tarifa_pico_nocturno_usd_kwh: 0.260
        objetivo: "Prohibición absoluta de subsidiar recarga de VE en horarios de estrés o despacho térmico"

# ------------------------------------------------------------------------------
# 6. TRANSICIÓN PRODUCTIVA INDUSTRIAL (ANTI-INFLACIONARIA)
# ------------------------------------------------------------------------------
transicion_industrial:
  duracion_meses: 12
  esquema_escalonado:
    trimestre_1:
      meses: "1 a 3"
      absorcion_diferencial_real_pct: 33.0
    trimestre_2:
      meses: "4 a 6"
      absorcion_diferencial_real_pct: 66.0
    trimestre_3:
      meses: "7 a 12"
      absorcion_diferencial_real_pct: 100.0
  mecanismo_financiamiento_verde:
    entidades: ["CFN", "BanEcuador", "Banco Central del Ecuador"]
    tasa_interes_anual_pct: 5.0
    plazo_credito_anos: 7
    destinos: ["Instalación de techos solares fotovoltaicos", "Sistemas de baterías BESS industriales"]

# ------------------------------------------------------------------------------
# 7. INFRAESTRUCTURA DE MEDICIÓN INTELIGENTE (AMI) Y GARANTÍA AUTOFINANCIADA
# ------------------------------------------------------------------------------
medicion_inteligente_ami:
  principio: "No gratuidad con depósito de garantía recuperable y fondo de rotación permanente"
  modelo_costo_garantia:
    costo_adquisicion_escala_usd: 60.00 # Rango: $55.00 a $65.00 USD
    recargo_operativo_garantia_pct: 10.0 # Nutre el fondo rotativo para stock permanente y calibración
    recargo_operativo_monto_usd: 6.00
    deposito_garantia_total_usd: 66.00
  amortizacion_usuario:
    plazo_cuotas_meses: 36 # Diferido en planilla mensual
    tasa_interes_pct: 0.0
    cuota_mensual_planilla_usd: 1.83
  devolucion_garantia:
    condicion: "Devolución íntegra del depósito si el usuario entrega el medidor al terminar el contrato o traspaso a nuevo titular"

# ------------------------------------------------------------------------------
# 8. PARIDAD DE RED Y ENERGÍA DISTRIBUIDA (SOLAR + BESS)
# ------------------------------------------------------------------------------
autogeneracion_solar:
  fast_track_conexion_dias_habiles: 15 # Silencio administrativo positivo
  esquema_compensacion: "net_billing_asimetrico_70_30"
  factor_reconocimiento_inyeccion_industrial: 0.70
  desglose_retencion_30pct:
    perdidas_tecnicas_red_pct: 10.0
    peaje_transmision_distribucion_snt_vad_pct: 10.0
    margen_resiliencia_ferre_pct: 10.0
  inyeccion_bess_pico_nocturno:
    reconocimiento_pct: 100.0
    tarifa_aplicada: "tarifa_marginal_horaria_pico"
    objetivo: "Aplanar el pico nacional de 18:00 a 22:00 horas"
  tope_capacidad_sgda_kwp: 2000 # Ampliable a 5000 kWp previa validación de alimentador
  manejo_dinamico_red:
    sistema_supervision: "DERMS (CENACE y Distribuidoras)"
    norma_inversores_obligatoria: "IEEE 1547-2018 / UL 1741 SB (Smart Inverters Grid-Forming)"
    funciones_autonomas_inversor: ["Volt-VAr", "Volt-Watt"]
    umbral_alerta_saturacion_alimentador_pct: 80.0
    jerarquia_despacho:
      - "1. Autoconsumo en sitio"
      - "2. Carga banco baterías BESS"
      - "3. Inyección dinámica regulada (70% reconocimiento)"
      - "4. Limitación activa de potencia (Curtailment) o Inyección Cero (Zero Export)"
    via_rapida_zero_export: true # Permite conexión inmediata sin inyección en circuitos saturados

  incentivo_bess_via_70_30:
    mecanismo: "La deducción del 30% en inyección diurna penaliza el vertido ciego y fuerza el almacenamiento BESS para consumo nocturno o inyección en punta al 100%"
    rentabilidad_largo_plazo:
      lcoe_solar_25_anos_usd_kwh: 0.050
      tarifa_historica_subsidiada_usd_kwh: 0.095
      reduccion_costo_estructural_industria_pct: 47.4

  brecha_remanente_deficit_estado:
    subsidio_diesel_transporte_pesado_usd: 1000000000
    subsidio_glp_domestico_15kg_usd: 750000000
    deficit_pensiones_salud_iess_usd: 1350000000
    total_brecha_remanente_deficit_cero_usd: 3100000000
    leccion_estrategica: "La reforma eléctrica cubre hasta el 78.5% del déficit; el remanente requiere reformar subsidios fósiles automotrices e IESS"

# ------------------------------------------------------------------------------
# 9. GOBERNANZA DEL FONDO ESPECIAL (FERRE)
# ------------------------------------------------------------------------------
fondo_reinversion_ferre:
  nombre_completo: "Fondo Especial de Reinversión y Resiliencia Eléctrica"
  siglas: "FERRE"
  naturaleza_juridica: "Cuenta fiduciaria especial e intangible"
  blindaje_fiscal: "Prohibición expresa de destinar fondos al Presupuesto General del Estado o gasto corriente"
  fuentes_recaudacion:
    - "Superávits provenientes de la venta de energía a costo real pleno a grandes consumidores"
    - "Saldos positivos resultantes de la liquidación del FCC"
  destinos_obligatorios:
    - "Mantenimiento mayor preventivo y correctivo del parque de generación del Estado"
    - "Incorporación de sistemas de almacenamiento BESS estratégicos en subestaciones críticas"
    - "Modernización y repotenciación de líneas del Sistema Nacional de Transmisión"
    - "Ampliación de redes de distribución rural y alumbrado público eficiente"
