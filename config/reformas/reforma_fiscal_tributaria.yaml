    caida_ventas_quito_pct: -3.5
    caida_ventas_guayaquil_pct: -4.4
    caida_sector_automotriz_pct: -18.7
    caida_importacion_insumos_pct: -10.0
    contraccion_pib_t2_2024_pct: -2.2
  efecto_rebote_demanda_plurianual:
    ano_1_retenciones_anticipadas_usd: 80000000
    ano_3_recuperacion_plena_ir_usd: 320000000
    recuperacion_ventas_estimada_pct: 4.8

# ------------------------------------------------------------------------------
# 2. SUSTITUCIÓN DE IMPUESTOS AL PATRIMONIO MUNICIPAL (COOTAD)
# ------------------------------------------------------------------------------
impuestos_municipales_patrimonio:
  recaudacion_historica_linea_base:
    patente_municipal_actual_usd: 260000000
    impuesto_1_5_por_mil_actual_usd: 230000000
    total_gad_actual_usd: 490000000
    impacto_adverso: "Penaliza la capitalización, inversiones en maquinaria y castiga empresas en pérdidas"
  mecanismo_sustitucion_aprobado:
    denominacion: "Sobretasa Municipal Coparticipada sobre la Renta Neta (SM-IR)"
    base_imponible_total_usd: 24800000000 # 21,000 M sociedades + 3,800 M personas naturales contabilidad
    alicuota_regulada_pct: 2.0 # 2.0% sobre la utilidad imponible genera 496 M USD
    regla_cero_ganancia: "Empresas con utilidad cero o pérdida contable tributan exactamente 0.00 USD"
    prorrateo_multijurisdiccional: "Distribución cantonal proporcional a ventas (60%) y nómina local (40%)"
    recaudacion_estimada_sm_ir_usd: 496000000
    tasa_habilitacion_rimpe_usd: 16000000 # 800,000 micronegocios a 20 USD/año
    recaudacion_total_reforma_gads_usd: 512000000 # Superávit municipal de +22 M USD (neutralidad plena)
    convenio_fiscalizacion_concurrente:
      acceso_sri_gads: true
      incentivo_auditoria_local_pct: 30.0 # GAD recibe 30% adicional sobre evasión de IR detectada en su cantón

# ------------------------------------------------------------------------------
# 3. ESCALAMIENTO Y FOCALIZACIÓN DEL GAS LICUADO DE PETRÓLEO (GLP)
