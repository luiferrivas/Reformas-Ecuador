gas_glp:
  precio_cilindro_base_usd: 1.60
  costo_real_importacion_logistica_usd: 13.50
  subsidio_unitario_actual_usd: 11.90
  gasto_fiscal_anual_glp_usd: 773500000
  regla_escalamiento_anual:
    incremento_porcentual_anual_pct: 10.0
    margen_infraestructura_post_paridad_pct: 10.0
    destino_margen: "Fondo de Renovación de Redes, Cilindros e Infraestructura de Gas Natural"
  sistema_cupos_antifrontera_y_nacional:
    fase_1_piloto_frontera:
      cantones: ["Tulcán", "Huaquillas", "Arenillas", "Macará", "Loja", "Sucumbíos"]
      cupo_maximo_adulto_mes: 1
      cupo_maximo_familia_dias: 35
      mecanismo_control: "Validación biométrica y cédula en punto de distribución"
      ahorro_contrabando_fronterizo_usd: 95200000 # 8 millones de cilindros recuperados
    fase_2_nacional:
      cupo_residencial_familias_dias: 40
      tarifa_excedente_usd: 13.50 # Tarifa comercial plena fuera de cupo
      ahorro_nacional_ano_1_usd: 95000000 # Captura del 50% de desvíos comerciales año 1
      ahorro_nacional_ano_3_usd: 280000000 # Captura plena
    ahorro_ajuste_precio_10pct_ano_1_usd: 10200000
    ahorro_total_glp_ano_1_usd: 200400000
    ahorro_total_glp_ano_3_usd: 380000000

# ------------------------------------------------------------------------------
# 4. FOCALIZACIÓN Y EXENCIÓN AUTOMÁTICA DEL IVA (TERCERA EDAD Y DISCAPACIDAD)
# ------------------------------------------------------------------------------
devolucion_iva:
  gasto_actual_anual_usd: 390000000
  mecanismo_operativo_preferente: "Exención automática directa en punto de venta (Tarifa 0% en caja) mediante consulta WebService SRI en tiempo real"
  mecanismo_operativo_supletorio: "Devolución digital centralizada para compras en comercios sin integración informática"
  segmentacion:
    discapacidad:
      costo_anual_anterior_usd: 70000000
      limite_ingresos_mensuales_sbu: 2 # Máximo 920 USD de ingreso individual verificado
      limite_patrimonio_rbu: 100
      condicion: "Discapacidad calificada >40% en MSP con cruce de ingresos IESS/SRI"
      restriccion_canasta:
        bienes_autorizados:
          - "Alimentos básicos para nutrición personal y familiar"
          - "Fármacos, salud general, medicamentos, prótesis, órtesis y tratamientos"
          - "Bienes esenciales de subsistencia e higiene personal"
        bienes_excluidos:
          - "Electrodomésticos, tecnología y vehículos"
          - "Hotelería, restaurantes y entretenimiento"
          - "Facturación comercial de terceros y empresas"
      costo_anual_reducido_usd: 35000000
      ahorro_fiscal_neto_usd: 35000000
    tercera_edad:
      costo_anual_anterior_usd: 320000000
      limite_ingresos_mensuales_sbu: 2 # Máximo 920 USD de ingreso para acceder
      limite_patrimonio_rbu: 100
      condicion: "Ciudadanos mayores a 65 años con cruce de ingresos IESS/SRI"
      restriccion_canasta:
        bienes_autorizados:
          - "Alimentos básicos para nutrición familiar"
          - "Medicamentos con prescripción, salud general y prótesis"
          - "Bienes esenciales de subsistencia e higiene personal"
        bienes_excluidos:
          - "Electrodomésticos y tecnología"
          - "Consumos en restaurantes, hotelería y entretenimiento"
          - "Facturas comerciales de terceros"
      costo_anual_reducido_usd: 80000000
      ahorro_fiscal_neto_usd: 240000000
  ahorro_total_devolucion_iva_usd: 275000000 # 240 M tercera edad + 35 M discapacidad
  evaluacion_umbral_descarte_1_5_sbu:
    umbral_evaluado_sbu: 1.5
    valor_mensual_usd: 690.00
    decision: "Descartado"
    justificacion_tecnica: "Se ubica por debajo de la Canasta Básica Familiar del INEC (795 USD). Genera vulnerabilidad crítica ante demandas de inconstitucionalidad por regresividad en la Corte Constitucional (Arts. 11.8 y 37 CRE), con un diferencial de ahorro marginal de solo 20 M USD frente a un costo político y de litigio desproporcionado."
  servicios_basicos_domicilio_unico:
    descripcion: "Regla unívoca de 1 solo suministro preferencial por cédula en agua potable, alcantarillado, recolección y electricidad"
    condicion: "Coincidencia estricta con residencia habitual validada en Registro Civil/CNE; bloqueo automático de suministros secundarios, vacacionales o arrendados"
    ahorro_anual_estimado_usd: 65000000 # Erradicación de beneficios múltiples en casas de playa y arriendos

